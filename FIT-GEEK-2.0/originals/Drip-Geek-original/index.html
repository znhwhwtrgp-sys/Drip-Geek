const CATEGORIES=['Oberteile','Hosen','Schuhe','Jacken','Kleider','Accessoires','Taschen','Sport','Sonstiges'];
const state={items:[],outfits:[],events:[],trips:[],wishlist:[],page:'home',filter:{q:'',category:'Alle',season:'Alle',sort:'newest',favorites:false},month:new Date().getMonth(),year:new Date().getFullYear(),photoData:null,db:null};
const fmtDate=s=>s?new Date(s+'T12:00:00').toLocaleDateString('de-DE'):'—';const today=()=>new Date().toISOString().slice(0,10);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const euro=n=>Number(n||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'});const iconFor=c=>({'Oberteile':'♧','Hosen':'▤','Schuhe':'◒','Jacken':'♧','Kleider':'♙','Accessoires':'✧','Taschen':'▣','Sport':'⌁','Sonstiges':'◇'}[c]||'◇');
function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2600)}
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){resolve(null);return}let req=indexedDB.open('drip-geek-standalone-v1',1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('app'))req.result.createObjectStore('app')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function persist(){const data={items:state.items,outfits:state.outfits,events:state.events,trips:state.trips,wishlist:state.wishlist};try{if(state.db){await new Promise((res,rej)=>{let tx=state.db.transaction('app','readwrite');tx.objectStore('app').put(data,'state');tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}else localStorage.setItem('drip-geek-state-v1',JSON.stringify(data))}catch(e){console.error(e);toast('Speicher voll oder nicht verfügbar. Bitte Fotos verkleinern oder Backup erstellen.')}}
async function hydrate(){try{state.db=await openDB();let data;if(state.db)data=await new Promise((res,rej)=>{let r=state.db.transaction('app').objectStore('app').get('state');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});else data=JSON.parse(localStorage.getItem('drip-geek-state-v1')||'null');if(data)for(let k of ['items','outfits','events','trips','wishlist'])state[k]=Array.isArray(data[k])?data[k]:[]}catch(e){console.warn('Persistenz nicht verfügbar',e);toast('Lokaler Speicher nicht verfügbar. Daten bleiben ggf. nur temporär.')}render()}
async function imageToData(file){if(!file||!file.type.startsWith('image/'))throw Error('Bitte eine Bilddatei auswählen.');if(file.size>15*1024*1024)throw Error('Das Bild ist größer als 15 MB.');return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onerror=()=>reject(Error('Foto konnte nicht gelesen werden.'));reader.onload=()=>{let img=new Image();img.onerror=()=>reject(Error('Ungültige Bilddatei.'));img.onload=()=>{let max=1000,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));let ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.82))};img.src=reader.result};reader.readAsDataURL(file)})}
function imgTag(item,cls=''){return item?.photo?`<img class="${cls}" src="${item.photo}" alt="${esc(item.name)}" loading="lazy">`:`<span class="placeholder" aria-hidden="true">${iconFor(item?.category)}</span>`}

function empty(title,desc,button=''){return `<div class="empty"><strong>${title}</strong>${desc}${button?`<div style="margin-top:16px">${button}</div>`:''}</div>`}

function home(){let total=state.items.length, outfits=state.outfits.length, fav=state.items.filter(i=>i.favorite).length, events=state.events.filter(e=>e.date>=today()).length;return pageHead('Dein persönlicher Überblick','Dein Stil. Deine Geschichte.','Deine Garderobe – organisiert, kombinierbar und bereit für jeden Tag.',`<button class="btn" data-action="add-item">＋ Kleidungsstück</button><button class="btn secondary" data-action="add-outfit">＋ Outfit erstellen</button>`)+`<div class="stats"><div class="stat"><div class="label">Kleidungsstücke</div><div class="num">${total}</div><div class="hint">In deinem Kleiderschrank</div></div><div class="stat"><div class="label">Outfits</div><div class="num">${outfits}</div><div class="hint">Deine Kombinationen</div></div><div class="stat"><div class="label">Favoriten</div><div class="num">${fav}</div><div class="hint">Deine Lieblingsteile</div></div><div class="stat"><div class="label">Anstehende Termine</div><div class="num">${events}</div><div class="hint">Geplante Outfits</div></div></div><div class="section-head"><div><h3>Zuletzt hinzugefügt</h3><p>Deine Garderobe auf einen Blick</p></div><button class="btn secondary small" data-page="schrank">Zum Kleiderschrank →</button></div><div class="grid">${state.items.slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,4).map(itemCard).join('')||empty('Dein Kleiderschrank wartet.','Füge dein erstes Kleidungsstück hinzu und beginne deine digitale Garderobe.',`<button class="btn" data-action="add-item">Kleidungsstück hinzufügen</button>`)}</div><div class="section-head"><div><h3>Deine Outfits</h3><p>Gespeicherte Kombinationen</p></div><button class="btn secondary small" data-page="outfits">Alle Outfits →</button></div><div class="grid">${state.outfits.slice(0,4).map(outfitCard).join('')||empty('Noch keine Outfits gespeichert.','Kombiniere deine vorhandenen Kleidungsstücke zu deinem ersten Look.',`<button class="btn" data-action="add-outfit">Outfit erstellen</button>`)}</div><div function schrank(){let list=state.items.filter(i=>{let f=state.filter;return(!f.q||[i.name,i.category,i.color,i.brand,i.notes].join(' ').toLowerCase().includes(f.q.toLowerCase()))&&(f.category==='Alle'||i.category===f.category)&&(f.season==='Alle'||i.season===f.season)&&(!f.favorites||i.favorite)});list.sort((a,b)=>state.filter.sort==='name'?a.name.localeCompare(b.name,'de'):state.filter.sort==='category'?a.category.localeCompare(b.category,'de'):state.filter.sort==='oldest'?a.createdAt-b.createdAt:b.createdAt-a.createdAt);return pageHead('Digitaler Kleiderschrank','Deine Kleidung. Perfekt organisiert.','Finde jedes Teil schnell – mit Filtern, Favoriten und eigenen Fotos.',`<button class="btn" data-action="add-item">＋ Hinzufügen</button>`)+`<div class="panel"><div class="filters"><input class="search" id="searchItems" value="${esc(state.filter.q)}" placeholder="⌕  Suche nach Kleidung, Marke oder Farbe …" aria-label="Kleidung suchen"><div class="field"><label for="filterCategory">Kategorie</label><select id="filterCategory">${['Alle',...CATEGORIES].map(x=>`<option ${state.filter.category===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="filterSeason">Saison</label><select id="filterSeason">${['Alle','Ganzjährig','Frühling','Sommer','Herbst','Winter'].map(x=>`<option ${state.filter.season===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="sortItems">Sortieren</label><select id="sortItems"><option value="newest" ${state.filter.sort==='newest'?'selected':''}>Neueste zuerst</option><option value="oldest" ${state.filter.sort==='oldest'?'selected':''}>Älteste zuerst</option><option value="name" ${state.filter.sort==='name'?'selected':''}>Name A–Z</option><option value="category" ${state.filter.sort==='category'?'selected':''}>Kategorie</option></select></div></div><div class="toolbar"><button class="chip ${state.filter.favorites?'active':''}" data-action="toggle-favorites">♡ Nur Favoriten</butto function stylePage(){let outfits=state.outfits;return pageHead('Style-Entdeckung','Finde deinen nächsten Look.','Praktische Vorschläge auf Basis deiner eigenen Garderobe.',`<button class="btn" data-action="suggest-look">✧ Look vorschlagen</button>`)+`<section class="weather-panel" aria-labelledby="weatherTitle"><div class="eyebrow silver-icon">✧ OUTFIT NACH WETTER</div><h3 id="weatherTitle" style="margin:5px 0 4px;font-weight:450">Was passt heute nach draußen?</h3><p class="muted">Aktuelle Wetterdaten abrufen und passende Teile aus deinem Kleiderschrank kombinieren.</p><div class="toolbar"><div class="field" style="flex:1;min-width:190px"><label for="weatherCity">Stadt oder Ort</label><input id="weatherCity" placeholder="z. B. Berlin" value="${esc(localStorage.getItem('fg-weather-city')||'Berlin')}"></div><div style="display:flex;align-items:end"><button class="btn" data-action="weather-check">Wetter prüfen & Outfit finden</button></div></div><div id="weatherOutput"><p class="meta">Gib deinen Ort ein und rufe das aktuelle Wetter ab. Für Wetterdaten ist eine Internetverbindung nötig.</p></div></section><div class="layout-two" style="margin-top:16px"><div class="panel"><div class="eyebrow">Dein Anlass</div><h3>Wofür suchst du ein Outfit?</h3><div class="chips" id="styleOccasions"><button class="chip active" data-occasion="Alltag">Alltag</button><button class="chip" data-occasion="Arbeit">Arbeit</button><button class="chip" data-occasion="Freizeit">Freizeit</button><button class="chip" data-occasion="Ausgehen">Ausgehen</button><button class="chip" data-occasion="Reise">Reise</button></div><div class="field" style="margin-top:18px"><label for="styleSeason">Saison</label><select id="styleSeason"><option>Ganzjährig</option><option>Frühling</option><option>Sommer</option><option>Herbst</option><option>Winter</option></select></div><button class="btn" style="margin-top:16px" data-action="suggest-look">Outfit zusammenstellen</button><div id="suggestionResult" style="margin-top:16px"></div></div><div class="panel"><div class="eyebrow">Style-Tipp</div><h3>Mehr aus dem machen, was du hast</h3><p class="muted">Ein vielseitiger Kleiderschrank besteht aus Teilen, die sich miteinander kombinieren lassen. Beginne mit neutralen Basisfarben und ergänze gezielt Texturen oder Akzente.</p><div class="list-row"><span class="tag">01</span><div class="grow"><strong>Basis schaffen</strong><small>Oberteil, Hose und Schuhe als Ausgangspunkt.</small></div></div><div class="list-row"><span class="tag">02</span><div class="grow"><strong>Eine Ebene ergänzen</strong><small>Jacke oder Accessoire verleiht dem Look Tiefe.</small></div></div><div class="list-row"><span class="tag">03</span><div class="grow"><strong>Lieblingsteile wiederverwenden</strong><small>Ein Teil kann in mehreren Kombinationen funktionieren.</small></div></div></div></div><div class="section-head"><div><h3>Deine Favoriten</h3><p>Teile, die du besonders gern trägst.</p></div><button class="btn secondary small" data-page="schrank">Im Schrank ansehen</button></div><div class="grid">${state.items.filter(i=>i.favorite).map(itemCard).join('')||empty('Noch keine Favoriten.','Markiere Kleidungsstücke mit dem Herzsymbol.')}</div>`}
function calendarPage(){let first=new Date(state.year,state.month,1),offset=(first.getDay()+6)%7,days=new Date(state.year,state.month+1,0).getDate(),prevDays=new Date(state.year,state.month,0).getDate();let cells=[];for(let i=0;i<42;i++){let d,month=state.month,year=state.year,muted=false;if(i<offset){d=prevDays-offset+i+1;month--;muted=true}else if(i>=offset+days){d=i-offset-days+1;month++;muted=true}else d=i-offset+1;let date=new Date(year,month,d),iso=`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`,ev=state.events.filter(e=>e.date===iso);cells.push(`<button class="day ${muted?'muted':''} ${iso===today()?'today':''}" data-action="add-event-date" data-date="${iso}"><span class="dnum">${d}</span>${ev.slice(0,2).map(e=>`<div class="event" title="${esc(e.title)}">${esc(e.title)}</div>`).join('')}</button>`)}return pageHead('Kalender & Reiseplanung','Plane mit Stil.','Behalte Termine, Outfits und Reisen im Überblick.',`<button class="btn" data-action="add-event">＋ Termin</button><button class="btn secondary" data-action="add-trip">＋ Reise</button>`)+`<div class="panel"><div class="section-head" style="margin-top:0"><div><h3>${new Date(state.year,state.month,1).toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</h3></div><div class="actions"><button class="btn secondary small" data-action="prev-month" aria-label="Vorheriger Monat">←</button><button class="btn secondary small" data-action="today-month">Heute</button><button class="btn secondary small" data-action="next-month" aria-label="Nächster Monat">→</button></div></div><div class="calendar">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(d=>`<div class="weekday">${d}</div>`).join('')}${cells.join('')}</div><p class="meta">Tippe auf einen Tag, um einen Termin zu planen.</p></div><div class="section-head"><div><h3>Anstehende Termine</h3><p>Deine geplanten Looks</p></div></div><div class="panel">${state.events.filter(e=>e.date>=today()).sort((a,b)=>a.da function statsPage(){let cats=CATEGORIES.map(c=>({name:c,count:state.items.filter(i=>i.category===c).length})).filter(x=>x.count).sort((a,b)=>b.count-a.count);let totalPrice=state.items.reduce((n,i)=>n+Number(i.price||0),0);let max=Math.max(1,...cats.map(c=>c.count));return pageHead('Statistiken & Analyse','Dein Stil in Zahlen.','Ein Überblick über deine Garderobe und deine Nutzung.',`<button class="btn secondary" data-action="export">↓ Backup exportieren</button>`)+`<div class="stats"><div class="stat"><div class="label">Kleidungsstücke</div><div class="num">${state.items.length}</div><div class="hint">Insgesamt gespeichert</div></div><div class="stat"><div class="label">Outfits</div><div class="num">${state.outfits.length}</div><div class="hint">Kombinationen erstellt</div></div><div class="stat"><div class="label">Lieblingsteile</div><div class="num">${state.items.filter(i=>i.favorite).length}</div><div class="hint">Als Favorit markiert</div></div><div class="stat"><div class="label">Erfasster Wert</div><div class="num" style="font-size:23px">${euro(totalPrice)}</div><div class="hint">Summe optionaler Preisangaben</div></div></div><div class="layout-two"><div class="panel"><h3 style="font-weight:500;margin-top:0">Kategorien</h3>${cats.map(c=>`<div style="margin:14px 0"><div class="inline" style="justify-content:space-between;margin-bottom:6px"><span>${esc(c.name)}</span><span class="meta">${c.count}</span></div><div class="bar"><span style="width:${100*c.count/max}%"></span></div></div>`).join('')||'<p class="muted">Füge Kleidung hinzu, um deine Kategorien zu sehen.</p>'}</div><div class="panel"><h3 style="font-weight:500;margin-top:0">Garderoben-Insights</h3><div class="list-row"><div class="grow"><strong>Am häufigsten vertreten</strong><small>${cats[0]?.name||'Noch keine Daten'}</small></div><span class="tag">${cats[0]?.count||0} Teile</span></div><div class="list-row"><div class="grow"><strong>Mit Foto</strong><small>Kleidungsstücke mit Bild</small></div><span class="tag">${state.items.filter(i=>i.photo).length} / ${state.items.length}</span></div><div class="list-row"><div class="grow"><strong>Geplante Termine</strong><small>Insgesamt im Kalender</small></div><span class="tag">${state.events.length}</span></div><div class="list-row"><div class="grow"><strong>Wunschliste</strong><small>Vorgemerkte Teile</small></div><span class="tag">${state.wishlist.length}</span></div><p class="meta" style="margin-top:15px">Die Statistiken werden aus deinen gespeicherten Daten berechnet. Preise sind freiwillige Angaben.</p></div></div>`}
function morePage(){return pageHead('Mehr aus Drip Geek','Alles an einem Ort.','Wunschliste, Datensicherung und Privatsphäre.',`<button class="btn secondary" data-action="export">↓ Backup exportieren</button>`)+`<div class="section-head"><div><h3>Wunschliste</h3><p>Teile, die du dir für später merken möchtest.</p></div><button class="btn" data-action="add-wish">＋ Wunsch hinzufügen</button></div><div class="panel">${state.wishlist.map(w=>`<div class="list-row"><div class="grow"><strong>${esc(w.name)}</strong><small>${esc(w.category||'')} ${w.price?'· '+euro(w.price):''} ${w.url?'· <a href="'+esc(w.url)+'" target="_blank" rel="noopener noreferrer">Link öffnen</a>':''}</small></div><button class="btn ghost small danger" data-action="delete-wish" data-id="${w.id}">Entfernen</button></div>`).join('')||'<p class="muted">Deine Wunschliste ist noch leer.</p>'}</div><div class="section-head"><div><h3>Einstellungen & Datenschutz</h3><p>Du behältst die Kontrolle über deine Daten.</p></div></div><div class="settings-grid"><div class="panel"><h3 style="margin-top:0;font-weight:500">Datensicherung</h3><p class="muted">Exportiere Kleidungsstücke, Fotos, Outfits, Termine, Reisen und Wunschliste als JSON-Datei. Bewahre sie sicher auf.</p><div class="actions"><button class="btn" data-action="export">Backup exportieren</button><button class="btn secondary" data-action="import">Backup importieren</button><input id="importFile" class="hidden" type="file" accept="application/json,.json"></div></div><div class="panel"><h3 style="margin-top:0;font-weight:500">Lokale Speicherung</h3><p class="muted">Deine Daten werden in diesem Browser auf diesem Gerät gespeichert. Sie werden nicht automatisch mit anderen Geräten synchronisiert.</p><p class="meta">Fotos werden in der IndexedDB gespeichert, sofern verfügbar. Im Privatmodus oder bei gelöschten Browserdaten können Daten verloren gehen.</p><button class="btn ghost danger" data-action="clear-data">Alle lokalen Daten löschen</button></div></div><div class="section-head"><div><h3>Über Drip Geek</h3></div></div><div class="panel"><div class="eyebrow">Dein Stil. Deine Kleidung. Dein Leben.</div><p class="muted">Eine lokal nutzbare, eigenständige Garderoben-App. Keine Anmeldung erforderlich. Diese Version benötigt keine externen JavaScript-Bibliotheken.</p><div class="inline"><span class="tag">Offline-Grundfunktion</span><span class="tag">Responsive</span><span class="tag">JSON-Backup</span></div></div>`}
function render(){let el=$('#main');const pages={home,schrank,outfits:outfitsPage,style:stylePage,statistik:statsPage,mehr:morePage};el.innerHTML=(pages[state.page]||home)();$$('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));document.title=`${({home:'Home',schrank:'Kleiderschrank',outfits:'Outfit-Studio',style:'Style-Entdeckung',statistik:'Statistiken',mehr:'Mehr'})[state.page]||'Home'} · Drip Geek`;}
function showPage(p){state.page=p;render();window.scrollTo({top:0,behavior:'smooth'});$('#main').focus({preventScroll:true})}
function openItem(id){let item=state.items.find(i=>i.id===id);$('#itemForm').reset();state.photoData=item?.photo||null;$('#itemId').value=item?.id||'';$('#itemDialogTitle').textContent=item?'Kleidungsstück bearbeiten':'Kleidungsstück hinzufügen';for(let [field,key] of [['itemName','name'],['itemCategory','category'],['itemColor','color'],['itemSeason','season'],['itemBrand','brand'],['itemSize','size'],['itemPrice','price'],['itemCondition','condition'],['itemFavorite','favorite'],['itemNotes','notes']])$('#'+field).value=item?(key==='favorite'?String(!!item[key]):item[key]??''):(key==='category'?'Oberteile':key==='season'?'Ganzjährig':key==='condition'?'Sehr gut':key==='favorite'?'false':'');$('#photoPreview').innerHTML=state.photoData?`<img src="${state.photoData}" alt="Foto-Vorschau">`:'＋ Foto auswählen oder hier klicken';$('#itemPhoto').value='';$('#itemDialog').showModal()}
function openOutfit(id){if(!state.items.length){toast('Füge zuerst Kleidungsstücke hinzu.');return}let o=state.outfits.find(x=>x.id===id);$('#outfitForm').reset();$('#outfitId').value=o?.id||'';$('#outfitDialogTitle').textContent=o?'Outfit bearbeiten':'Outfit erstellen';$('#outfitName').value=o?.name||'';$('#outfitOccasion').value=o?.occasion||'Alltag';$('#outfitSeason').value=o?.season||'Ganzjährig';$('#outfitNotes').value=o?.notes||'';$('#outfitItemChoices').innerHTML=state.items.map(i=>`<label class="item-card" style="cursor:pointer"><div class="item-image" style="aspect-ratio:1/1">${imgTag(i)}</div><div class="item-body"><div class="inline"><input type="checkbox" name="outfitItems" value="${i.id}" ${(o?.itemIds||[]).includes(i.id)?'checked':''}><span style="font-size:11px">${esc(i.name)}</span></div></div></label>`).join('');$('#outfitDialog').showModal()}
function openEvent(date=today()){if(!state.outfits.length)toast('Du kannst auch ohne Outfit einen Termin speichern.');$('#eventForm').reset();$('#eventDate').value=date;$('#eventOutfit').innerHTML='<option value="">Kein Outfit</option>'+state.outfits.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('');$('#eventDialog').showModal()}
function openTrip(){$('#tripForm').reset();$('#tripStart').value=today();$('#tripEnd').value=today();$('#tripDialog').showModal()}
function download(name,content,type='application/json'){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportData(){download(`drip-geek-backup-${today()}.json`,JSON.stringify({app:'Drip Geek',version:1,exportedAt:new Date().toISOString(),items:state.items,outfits:state.outfits,events:state.events,trips:state.trips,wishlist:state.wishlist},null,2));toast('Backup wurde erstellt.')}
async function importData(file){try{let d=JSON.parse(await file.text());if(!d||!Array.isArray(d.items)||!Array.isArray(d.outfits))throw Error('Das ist kein gültiges Drip Geek-Backup.');if(!confirm('Backup importieren und die aktuellen App-Daten ersetzen? Exportiere bei Bedarf zuerst ein Backup.'))return;for(let k of ['items','outfits','events','trips','wishlist'])state[k]=Array.isArray(d[k])?d[k]:[];await persist();render();toast('Backup erfolgreich importiert.')}catch(e){alert('Import fehlgeschlagen: '+e.message)}}
function suggestLook(){let occasion=$('#styleOccasions .active')?.dataset.occasion||'Alltag',season=$('#styleSeason')?.value||'Ganzjährig',eligible=state.items.filter(i=>i.season==='Ganzjährig'||i.season===season);if(!eligible.length){$('#suggestionResult').innerHTML='<p class="muted">Noch keine passenden Kleidungsstücke. Füge Teile hinzu oder ändere die Saison.</p>';return}let rank={Oberteile:0,Kleider:0,Hosen:1,Schuhe:2,Jacken:3,Accessoires:4,Taschen:4,Sport:5,Sonstiges:6},chosen=[];for(let cat of ['Oberteile','Kleider','Hosen','Schuhe','Jacken','Accessoires','Taschen']){let choices=eligible.filter(i=>i.category===cat);if(choices.length&&!(cat==='Kleider'&&chosen.some(x=>x.category==='Oberteile'))&&!(cat==='Hosen'&&chosen.some(x=>x.category==='Kleider')))chosen.push(choices[Math.floor(Math.random()*choices.length)])}if(!chosen.length)chosen=eligible.slice(0,3);$('#suggestionResult').innerHTML=`<div class="eyebrow">Look-Vorschlag · ${esc(occasion)}</div><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-top:10px">${chosen.map(itemCard).join('')}</div><p class="meta">Vorschlag aus deinen vorhandenen Teilen. Prüfe selbst, ob Wetter und Anlass passen.</p><button class="btn secondary small" data-action="save-suggestion" data-ids="${chosen.map(i=>i.id).join(',')}">Als Outfit speichern</button>`}
async function suggestWeatherOutfit(){const city=$('#weatherCity')?.value.trim();const out=$('#weatherOutput');if(!city){toast('Bitte gib zuerst einen Ort ein.');return}localStorage.setItem('fg-weather-city',city);out.innerHTML='<p class="muted">Wetterdaten werden geladen …</p>';try{const geo=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(city)+'&count=1&language=de&format=json');if(!geo.ok)throw Error('Ort konnte nicht gesucht werden.');const gd=await geo.json();if(!gd.results?.length)throw Error('Ort nicht gefunden. Bitte prüfe die Schreibweise.');const place=gd.results[0];const wr=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}&current=temperature_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=1`);if(!wr.ok)throw Error('Wetterdienst ist gerade nicht erreichbar.');const w=await wr.json(),c=w.current,d=w.daily;const code=c.weather_code;const desc=code===0?'Klar':code<=3?'Bewölkt':code<=48?'Nebel':code<=67?'Regen':code<=77?'Schnee':code<=82?'Regenschauer':code<=86?'Schneeschauer':'Gewitter';const cold=c.temperature_2m<9,wet=c.precipitation>0||((d.precipitation_probability_max||[0])[0]>=45),warm=c.temperature_2m>=22;let wanted=[];const add=(cats)=>state.items.filter(i=>cats.includes(i.category));if(cold)wanted.push(...add(['Jacken']),...add(['Oberteile']),...add(['Hosen']));else if(warm)wanted.push(...add(['Oberteile','Kleider']),...add(['Hosen','Schuhe']));else wanted.push(...add(['Oberteile','Hosen','Kleider']));if(wet)wanted.push(...add(['Jacken']));wanted.push(...add(['Schuhe']));wanted=[...new Map(wanted.map(i=>[i.id,i])).values()].slice(0,4);const weatherAdvice=cold?'Setze auf Schichten und eine warme Jacke.':warm?'Leichte, atmungsaktive Teile sind eine gute Wahl.':'Kombiniere ein vielseitiges Oberteil mit einer passenden Lage.';const rainAdvice=wet?'Regen ist möglich: Wähle eine wetterfeste Jacke und geeignete Schuhe.':'Aktuell wird anhand der Vorhersage keine hohe Regenwahrscheinlichkeit gemeldet.';out.innerHTML=`<div class="inline" style="justify-content:space-between;flex-wrap:wrap"><div><div class="eyebrow">${esc(place.name)}${place.admin1?', '+esc(place.admin1):''}</div><h3 style="font-size:30px;font-weight:400;margin:3px 0">${Math.round(c.temperature_2m)}°C <span class="weather-icon silver-icon">${code===0?'☼':wet?'☂':'☁'}</span></h3><p class="muted">${desc} · gefühlt ${Math.round(c.apparent_temperature)}°C · Wind ${Math.round(c.wind_speed_10m)} km/h</p></div><span class="tag">Heute · ${Math.round(d.temperature_2m_min[0])}° / ${Math.round(d.temperature_2m_max[0])}°</span></div><div class="notice" style="margin-top:12px">${weatherAdvice} ${rainAdvice}</div><div class="section-head"><div><h3>Passende Teile aus deinem Schrank</h3><p>Automatische Auswahl nach Temperatur und Regenlage</p></div></div>${wanted.length?`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(135px,1fr))">${wanted.map(itemCard).join('')}</div><p class="meta" style="margin-top:10px">Die Auswahl basiert auf den Kategorien deiner gespeicherten Kleidung. Saison, Material und Wasserfestigkeit werden nur berücksichtigt, wenn du diese Angaben selbst gepflegt hast.</p>`:`<div class="empty"><strong>Dein Kleiderschrank ist noch leer.</strong>Füge Kleidung hinzu, damit wir passende Teile empfehlen können.</div>`}`;}catch(e){out.innerHTML=`<div class="notice">${esc(e.message||'Wetterdaten konnten nicht geladen werden.')}<br>Prüfe deine Internetverbindung und versuche es erneut.</div>`}}
function deleteItem(id){let item=state.items.find(i=>i.id===id);if(!item)return;if(!confirm(`„${item.name}“ wirklich löschen? Das Teil wird auch aus gespeicherten Outfit-Zuordnungen entfernt.`))return;state.items=state.items.filter(i=>i.id!==id);state.outfits.forEach(o=>o.itemIds=o.itemIds.filter(x=>x!==id));persist().then(render);toast('Kleidungsstück gelöscht.')}
function action(a,el){let id=el.dataset.id,item=state.items.find(i=>i.id===id),outfit=state.outfits.find(o=>o.id===id);switch(a){case'add-item':openItem();break;case'edit-item':openItem(id);break;case'delete-item':deleteItem(id);break;case'favorite':if(item){item.favorite=!item.favorite;persist().then(render)}break;case'toggle-favorites':state.filter.favorites=!state.filter.favorites;render();break;case'clear-filters':state.filter={q:'',category:'Alle',season:'Alle',sort:'newest',favorites:false};render();break;case'add-outfit':openOutfit();break;case'edit-outfit':openOutfit(id);break;case'duplicate-outfit':if(outfit){state.outfits.push({...outfit,id:uid(),name:outfit.name+' (Kopie)',createdAt:Date.now()});persist().then(render);toast('Outfit dupliziert.')}break;case'delete-outfit':if(outfit&&confirm(`Outfit „${outfit.name}“ löschen?`)){state.outfits=state.outfits.filter(o=>o.id!==id);state.events.forEach(e=>{if(e.outfitId===id)e.outfitId='' });persist().then(render);toast('Outfit gelöscht.')}break;case'plan-outfit':openEvent();setTimeout(()=>{$('#eventOutfit').value=id;$('#eventTitle').value=outfit?.name||''},0);break;case'suggest-look':suggestLook();break;case'weather-check':suggestWeatherOutfit();break;case'save-suggestion':{let ids=(el.dataset.ids||'').split(',').filter(Boolean);let name=prompt('Wie soll dein Outfit heißen?','Neuer Look');if(name?.trim()){state.outfits.push({id:uid(),name:name.trim(),occasion:$('#styleOccasions .active')?.dataset.occasion||'Alltag',season:$('#styleSeason')?.value||'Ganzjährig',notes:'Aus Style-Vorschlag erstellt',itemIds:ids,createdAt:Date.now()});persist().then(()=>{showPage('outfits');toast('Outfit gespeichert.')})}break}case'add-trip':openTrip();break;case'delete-trip':if(confirm('Reise und Packliste löschen?')){state.trips=state.trips.filter(t=>t.id!==id);persist().then(render)}break;case'toggle-pack':{let t=state.trips.find(t=>t.id===el.dataset.trip),p=t?.items.find(p=>p.id===el.dataset.pack);if(p){p.packed=el.checked;persist().then(render)}break}case'delete-pack':{let t=state.trips.find(t=>t.id===el.dataset.trip);if(t){t.items=t.items.filter(p=>p.id!==el.dataset.pack);persist().then(render)}break}case'auto-pack':{let t=state.trips.find(t=>t.id===id);if(t){let names=new Set(t.items.map(p=>p.name));state.items.filter(i=>['Oberteile','Hosen','Schuhe','Jacken','Kleider','Accessoires'].includes(i.category)).slice(0,12).forEach(i=>{if(!names.has(i.name))t.items.push({id:uid(),name:i.name,packed:false,itemId:i.id})});persist().then(render);toast('Kleidungsstücke zur Packliste hinzugefügt.')}break}case'add-wish':{let name=prompt('Was möchtest du auf deine Wunschliste setzen?');if(name?.trim()){let price=prompt('Preis in EUR (optional, leer lassen wenn unbekannt):','');state.wishlist.push({id:uid(),name:name.trim(),price:price&&Number(price)>0?Number(price):null,category:'',url:''});persist().then(render)}break}case'delete-wish':if(confirm('Wunsch entfernen?')){state.wishlist=state.wishlist.filter(w=>w.id!==id);persist().then(render)}break;case'export':exportData();break;case'import':$('#importFile').click();break;case'clear-data':if(confirm('Wirklich alle lokalen Drip Geek-Daten inklusive Fotos löschen? Diese Aktion kann nicht rückgängig gemacht werden. Exportiere vorher ein Backup.')){for(let k of ['items','outfits','events','trips','wishlist'])state[k]=[];persist().then(()=>{render();toast('Lokale App-Daten gelöscht.')})}break}}
$('#main').addEventListener('click',e=>{let nav=e.target.closest('[data-page]');if(nav){showPage(nav.dataset.page);return}let btn=e.target.closest('[data-action]');if(btn){if(btn.dataset.action==='toggle-pack'&&e.target!==btn)return;action(btn.dataset.action,btn)}});
$$('[data-page]').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));$$('[data-close]').forEach(b=>b.addEventListener('click',()=>$('#'+b.dataset.close).close()));
$('#itemPhoto').addEventListener('change',async e=>{let f=e.target.files?.[0];if(!f)return;try{state.photoData=await imageToData(f);$('#photoPreview').innerHTML=`<img src="${state.photoData}" alt="Foto-Vorschau">`}catch(err){toast(err.message);e.target.value=''}});
$('#itemForm').addEventListener('submit',async e=>{e.preventDefault();let id=$('#itemId').value,old=state.items.find(i=>i.id===id);let item={id:id||uid(),name:$('#itemName').value.trim(),category:$('#itemCategory').value,color:$('#itemColor').value.trim(),season:$('#itemSeason').value,brand:$('#itemBrand').value.trim(),size:$('#itemSize').value.trim(),price:$('#itemPrice').value===''?null:Number($('#itemPrice').value),condition:$('#itemCondition').value,favorite:$('#itemFavorite').value==='true',notes:$('#itemNotes').value.trim(),photo:state.photoData,createdAt:old?.createdAt||Date.now(),updatedAt:Date.now()};if(!item.name)return;let idx=state.items.findIndex(i=>i.id===item.id);if(idx>=0)state.items[idx]=item;else state.items.unshift(item);await persist();$('#itemDialog').close();render();toast(idx>=0?'Kleidungsstück aktualisiert.':'Kleidungsstück hinzugefügt.')});
$('#outfitForm').addEventListener('submit',async e=>{e.preventDefault();let id=$('#outfitId').value,old=state.outfits.find(o=>o.id===id),itemIds=$$('[name="outfitItems"]:checked').map(x=>x.value);if(!itemIds.length&&!confirm('Outfit ohne Kleidungsstücke speichern?'))return;let o={id:id||uid(),name:$('#outfitName').value.trim(),occasion:$('#outfitOccasion').value,season:$('#outfitSeason').value,notes:$('#outfitNotes').value.trim(),itemIds,createdAt:old?.createdAt||Date.now(),updatedAt:Date.now()};let idx=state.outfits.findIndex(x=>x.id===o.id);if(idx>=0)state.outfits[idx]=o;else state.outfits.unshift(o);await persist();$('#outfitDialog').close();render();toast(idx>=0?'Outfit aktualisiert.':'Outfit gespeichert.')});
$('#eventForm').addEventListener('submit',async e=>{e.preventDefault();let event={id:uid(),title:$('#eventTitle').value.trim(),date:$('#eventDate').value,outfitId:$('#eventOutfit').value};if(!event.title||!event.date)return;state.events.push(event);await persist();$('#eventDialog').close();render();toast('Termin gespeichert.')});
$('#tripForm').addEventListener('submit',async e=>{e.preventDefault();let start=$('#tripStart').value,end=$('#tripEnd').value;if(end<start){alert('Das Enddatum darf nicht vor dem Startdatum liegen.');return}state.trips.push({id:uid(),name:$('#tripName').value.trim(),start,end,notes:$('#tripNotes').value.trim(),items:[{id:uid(),name:'Outfits',packed:false},{id:uid(),name:'Schuhe',packed:false},{id:uid(),name:'Pflege & Accessoires',packed:false}]});await persist();$('#tripDialog').close();render();toast('Reise erstellt.')});
$('#main').addEventListener('input',e=>{if(e.target.id==='searchItems'){let pos=e.target.selectionStart;state.filter.q=e.target.value;let y=window.scrollY;render();let input=$('#searchItems');input?.focus();input?.setSelectionRange(pos,pos);window.scrollTo(0,y)}});$('#main').addEventListener('change',e=>{if(e.target.id==='filterCategory')state.filter.category=e.target.value;else if(e.target.id==='filterSeason')state.filter.season=e.target.value;else if(e.target.id==='sortItems')state.filter.sort=e.target.value;else return;render()});
$('#main').addEventListener('click',e=>{let occ=e.target.closest('[data-occasion]');if(occ){$$('[data-occasion]').forEach(b=>b.classList.toggle('active',b===occ))}});
$('#main').addEventListener('submit',async e=>{let form=e.target.closest('[data-form="add-pack"]');if(!form)return;e.preventDefault();let t=state.trips.find(t=>t.id===form.dataset.trip),name=new FormData(form).get('packName')?.toString().trim();if(t&&name){t.items.push({id:uid(),name,packed:false});await persist();render();toast('Packlistenpunkt hinzugefügt.')}});
$('#importFile').addEventListener('change',e=>{if(e.target.files?.[0])importData(e.target.files[0]);e.target.value=''});
